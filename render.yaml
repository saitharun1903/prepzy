# FREE Render Blueprint for Prepzy: ONE service runs the web app and the API (with its embedded worker).
# Nothing is created until you open https://dashboard.render.com/blueprints -> New Blueprint Instance -> this repo
# and approve it. Values marked `sync: false` are asked for once, in Render's UI. See docs/DEPLOYMENT.md.
# The paid setup (self-hosted Ollama, separate worker, S3) is infrastructure/render/render.paid.yaml.
#
# Topology:  browser / extension ──https──> prepzy (Next.js on $PORT ─▶ FastAPI on 127.0.0.1:8000) ──> Neon, Groq, Brevo
# Why one service: free instances sleep after ~15 min idle and share 750 hours/month. One always-on service
# (~720 h) fits; two do not. Keep it awake with an external uptime ping to /health/live every 10 minutes.

services:
  - type: web
    name: prepzy
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./infrastructure/render/prepzy.Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeploy: false
    envVars:
      - key: ELEVATE_STORAGE_BACKEND
        value: db
      - key: ELEVATE_LLM_PROVIDER
        value: openai
      - key: ELEVATE_OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ELEVATE_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: ELEVATE_LLM_TIMEOUT_SECONDS
        value: "120"
      - key: ELEVATE_OPERATION_DEADLINE_MINUTES
        value: "30"
      - key: ELEVATE_DB_POOL_SIZE
        value: "4"
      - key: ELEVATE_AUTH_RATE_PER_MINUTE
        value: "60"
      - key: ELEVATE_JWT_SECRET
        generateValue: true
      - key: ELEVATE_METRICS_TOKEN
        generateValue: true
      - key: ELEVATE_JWT_ISSUER
        value: elevate
      - key: ELEVATE_REQUIRE_VERIFIED_EMAIL
        value: "true"
      - key: ELEVATE_EMAIL_BACKEND
        value: brevo
      - key: ELEVATE_LOG_LEVEL
        value: INFO
      - key: ELEVATE_EXTENSION_IDS
        value: bjhbbpnbmichlooillmiaeofcioofkni
      - key: ELEVATE_OPENAI_API_KEY     # Groq API key (console.groq.com -> API Keys)
        sync: false
      - key: ELEVATE_DATABASE_URL       # postgresql+psycopg://elevate_app:<pw>@<neon-host>/<db>?sslmode=require
        sync: false
      - key: ELEVATE_MIGRATION_DATABASE_URL   # same host, Neon owner role, ?sslmode=require
        sync: false
      - key: ELEVATE_DATA_KEY           # Fernet key (see docs/DEPLOYMENT.md); keep a copy
        sync: false
      - key: ELEVATE_BREVO_API_KEY
        sync: false
      - key: ELEVATE_EMAIL_FROM         # e.g. Prepzy <you@example.com> (a sender verified in Brevo)
        sync: false
      - key: ELEVATE_WEB_URL            # this service's URL, e.g. https://prepzy.onrender.com
        sync: false
      - key: ELEVATE_ALLOWED_ORIGINS    # same as ELEVATE_WEB_URL
        sync: false
      - key: ELEVATE_APP_ORIGINS        # same as ELEVATE_WEB_URL
        sync: false
