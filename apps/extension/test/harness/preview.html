    const fields = { title: "Java Software Engineer", company: "Droisys", location: "India", work_mode: "remote", employment_type: "Full-time" };
    const job = {
      job: { id: JOB, title: "Java Software Engineer", company: "Droisys", sourceUrl: URL_, saved: false },

        createdAt: null, isLatest: true, stale: false,

          req("r5", "Familiarity with Git, Maven, Gradle, and CI/CD pipelines.", "required", ["Git", "CI/CD"], "all", null),
          req("r6", "Experience working in AWS, Azure, or Google Cloud environments.", "preferred", ["AWS", "Microsoft Azure", "Google Cloud"], "any", null),

      startedAt: now - 60000, updatedAt: now, appliedAt: now, seq: 3 };
    const reply = (m) => {
      switch (m.type) {
        case "state.get": return { signedIn: true, email: "koppulasaitharunreddy7@gmail.com", record, recent: [], extraction: null, webBase: "http://localhost:3000" };
        case "job.get": return job;
        case "job.applications": return { current: null };

    const ev = { addListener() {} };
    window.chrome = {
      runtime: { sendMessage: async (m) => ({ ok: true, data: reply(m) }), id: "preview" },
      tabs: { query: async () => [{ id: 7, windowId: 1, url: URL_, title: "Java Software Engineer | Droisys | LinkedIn" }], create: async () => ({}), onActivated: ev, onUpdated: ev },
